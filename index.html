<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="./favicon.ico?v=2" type="image/x-icon">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Cafe Menu</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <!-- 상단 고정 영역 -->
    <header class="header">

        <div class="topRow">

            <img
                id="logo"
                src="images/logo.png"
                alt="Logo"
                draggable="false">

            <div class="languageArea">

                <img
                    id="btnJP"
                    class="langBtn"
                    src="images/japan.png"
                    alt="Japanese"
                    draggable="false">

                <img
                    id="btnCN"
                    class="langBtn"
                    src="images/china_on.png"
                    alt="Chinese"
                    draggable="false">

                <img
                    id="btnEN"
                    class="langBtn"
                    src="images/english.png"
                    alt="English"
                    draggable="false">

            </div>

        </div>

        <div class="categoryRow">

            <img
                id="btnSignature"
                class="menuBtn active"
                src="images/signature_on.png"
                alt="Signature"
                draggable="false">

            <img
                id="btnEspresso"
                class="menuBtn"
                src="images/espresso.png"
                alt="Espresso"
                draggable="false">

            <img
                id="btnColdBrew"
                class="menuBtn"
                src="images/coldbrew.png"
                alt="Cold Brew"
                draggable="false">

            <img
                id="btnBeverage"
                class="menuBtn"
                src="images/beverage.png"
                alt="Beverage"
                draggable="false">

        </div>

    </header>


    <!-- 메뉴 이미지 -->

    <main class="content">

        <img
            id="menuImage"
            src="images/cn_signature.jpg"
            alt="Menu"
            draggable="false">

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
